# Автоматичні тести при кожному push і Pull Request.
# Результат видно на GitHub: вкладка Actions або значок ✓/✗ біля коміту.
name: Тести

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Unit-тести (логіка, база, будова проєкту)
        run: npm run test:unit
      - name: Браузерні тести (усі екрани)
        run: npm run test:e2e
      - name: Стрес-тести
        run: npm run test:stress
      - name: Звіт Playwright (якщо щось упало)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
